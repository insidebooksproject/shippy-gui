name: CI

on:
  push:
    branches: [main, deploy]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extra: linux
          - os: windows-latest
            extra: windows
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install system libraries (Qt offscreen, CUPS headers)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libcups2-dev libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the project
        run: uv sync --locked --extra ${{ matrix.extra }} --dev

      - name: Check formatting
        run: uv run black --check src

      - name: Lint
        run: uv run pylint src

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        timeout-minutes: 10
        run: uv run python -m unittest discover -s tests
